<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontak Kami - Nasi Goreng ILK</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- My Style CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Navbar Start -->
    <nav class="navbar">
      <input type="checkbox" id="hamburger-menu" />

      <a href="indeks.html" class="navbar-logo">Nasi Goreng<span>ILK</span>.</a>

      <div class="navbar-nav">
        <a href="indeks.html#home">Home</a>
        <a href="indeks.html#about">Tentang Kami</a>
        <a href="menu.html">Menu</a>
        <a href="kontak.html">Kontak</a>
      </div>

      <label for="hamburger-menu" class="navbar-extra">
        <i data-feather="menu"></i>
      </label>
    </nav>
    <!-- Navbar End -->

    <!-- Contact Section Start -->
    <section id="contact" class="contact" style="padding-top: 8rem">
      <h2><span>Kontak</span> Kami</h2>
      <p>
        Punya pertanyaan, kritik, atau saran? Silakan kunjungi lokasi kami atau
        kirimkan pesan melalui formulir di bawah ini.
      </p>

      <div class="row">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3960.9216137533967!2d109.51979697401529!3d-6.899978093099276!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e6fd90030e789cd%3A0xf044eea9c8650560!2sNASGOR%20ILK!5e0!3m2!1sen!2sid!4v1789945734268!5m2!1sen!2sid"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
          class="map"
        ></iframe>

        <form>
          <div class="input-group">
            <i data-feather="user"></i>
            <input type="text" name="nama" placeholder="nama" />
          </div>
          <div class="input-group">
            <i data-feather="mail"></i>
            <input type="text" name="email" placeholder="email" />
          </div>
          <div class="input-group">
            <i data-feather="phone"></i>
            <input type="text" name="no_hp" placeholder="no hp" />
          </div>
          <div class="input-group">
            <i data-feather="message-square"></i>
            <input
              type="text"
              name="comment"
              placeholder="kritik dan saran"
              required
            />
          </div>
          <button type="submit" class="btn">kirim pesan</button>
        </form>
      </div>

      <div class="btn-wrap2">
        <a href="indeks.html" class="btn-beranda">Kembali ke Beranda</a>
      </div>
    </section>
    <!-- Contact Section End -->

    <!-- Footer Start -->
    <footer>
      <div class="social">
        <a href="https://www.instagram.com/"
          ><i data-feather="instagram"></i
        ></a>
        <a href="https://x.com/"><i data-feather="twitter"></i></a>
        <a href="https://www.facebook.com/"><i data-feather="facebook"></i></a>
      </div>

      <div class="links">
        <a href="indeks.html#home">Home</a>
        <a href="indeks.html#about">Tentang Kami</a>
        <a href="menu.html">Menu</a>
        <a href="kontak.html">Kontak</a>
      </div>

      <div class="credit">
        <p>Created by <a href="">Kelompok Nasi Goreng</a>. | &copy; 2026.</p>
      </div>
    </footer>
    <!-- Footer End -->

    <!-- Feather Icons Activation -->
    <script>
      feather.replace();
    </script>
  </body>
</html>
